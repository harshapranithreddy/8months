<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>8 Things I Made You</title>
<meta name="description" content="A small paper package, eight months in the making." />
<meta name="theme-color" content="#241A15" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div class="mat" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- ========================= 1. THE PACKAGE ========================= -->
<section class="view active" id="v-open">
  <div class="open-wrap">
    <div class="parcel" id="parcel">
      <div class="parcel-back">
        <p class="post-hand" id="postTo">for Laavanya</p>
        <p class="post-mono">EIGHT (8) MONTHS &middot; HANDLE WITH CARE</p>
      </div>
      <div class="parcel-flap">
        <div class="stamp-block">
          <span class="stamp"><b>8</b><i>MTHS</i></span>
          <span class="postmark">
            <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/><circle cx="45" cy="45" r="31"/></svg>
            <em id="markDate">SYD</em>
          </span>
        </div>
      </div>
      <div class="parcel-seal" id="parcelSeal">open</div>
    </div>
    <p class="tip pale" id="openTip">tap to open</p>
  </div>
</section>

<!-- ========================= 2. THE DESK ========================= -->
<section class="view" id="v-desk">
  <div class="desk-wrap">
    <p class="mono-kicker" id="deskKicker">FOR MY CUTIE &middot; NO. 08 OF 08</p>
    <h1 class="desk-title" id="deskTitle"></h1>
    <svg class="scribble" id="scribble" viewBox="0 0 300 20" aria-hidden="true">
      <path pathLength="340" d="M5 13C52 5 88 17 132 10c38-6 62 6 96 1 22-3 44-6 66-2"/>
    </svg>
    <p class="hand lead" id="deskNote"></p>

    <div class="ticks" id="ticks" aria-label="progress"></div>

    <div class="things" id="things"></div>
  </div>
</section>

<!-- ========================= 3. ONE THING ========================= -->
<section class="view" id="v-thing">
  <div class="sheet">
    <div class="sheet-top">
      <p class="mono-kicker" id="thingKicker">01</p>
      <button class="link" id="backBtn" type="button">back to the desk</button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="say" id="say" hidden>
      <span class="rule"></span>
      <p class="hand big" id="sayLine"></p>
      <button class="btn" id="sayBtn" type="button">put it back</button>
    </div>
  </div>
</section>

<!-- ========================= 4. THE POSTCARD ========================= -->
<section class="view" id="v-end">
  <div class="end-wrap">
    <p class="mono-kicker">ONE MORE THING</p>
    <div class="pc-scene">
      <div class="postcard" id="postcard">
        <div class="pc-face pc-front" id="pcFront"></div>
        <div class="pc-face pc-back">
          <div class="pc-left">
            <p class="hand" id="pcNote"></p>
            <p class="mono-kicker sm" id="pcSign"></p>
          </div>
          <div class="pc-right">
            <div class="pc-stamp"><b>8</b><i>MONTHS</i></div>
            <div class="pc-lines"><i></i><i></i><i></i></div>
          </div>
          <div class="pc-grid" id="pcGrid"></div>
        </div>
      </div>
    </div>
    <p class="tip pale" id="pcTip">tap the postcard to turn it over</p>
    <button class="link" id="againBtn" type="button">start again</button>
  </div>
</section>

<style>
/* ========================= TOKENS ========================= */
:root{
  --mat:#241A15;
  --kraft-sheet:#D8C3A0;
  --paper:#F7F1E4;
  --kraft:#E3D7BF;
  --ink:#15212C;
  --ink-soft:#5A6570;
  --pink:#FF5470;
  --marigold:#F0B429;
  --f-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --f-mono:'DM Mono',ui-monospace,monospace;
  --f-hand:'Shantell Sans','Segoe Print','Bradley Hand',cursive;
  --hard:6px 6px 0 rgba(0,0,0,.30);
  --hard-sm:3px 3px 0 rgba(0,0,0,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100%;background:var(--mat);color:var(--ink);
  font-family:var(--f-mono);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

/* the surface: a dark table under a warm lamp. nothing else. */
.mat{position:fixed;inset:0;z-index:0;background:var(--mat)}
.mat::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 55% at 50% 24%,rgba(255,206,148,.14),transparent 66%)}
.mat::after{content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 50% 40%,transparent 38%,rgba(0,0,0,.52) 100%),
    radial-gradient(rgba(255,255,255,.05) .7px,transparent .8px);
  background-size:auto,5px 5px}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}

/* ========================= VIEWS ========================= */
.view{position:fixed;inset:0;z-index:5;display:flex;overflow-y:auto;overflow-x:hidden;
  padding:clamp(20px,5vw,52px) clamp(16px,4vw,40px);
  opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;
  -webkit-overflow-scrolling:touch}
.view.active{opacity:1;visibility:visible}
.open-wrap,.desk-wrap,.sheet,.end-wrap{margin:auto;width:100%}
.open-wrap{max-width:540px;text-align:center}
.desk-wrap{max-width:960px;background:var(--kraft-sheet);padding:clamp(22px,4.5vw,44px);
  box-shadow:14px 16px 0 rgba(0,0,0,.34);
  background-image:radial-gradient(rgba(21,33,44,.05) .7px,transparent .8px);
  background-size:5px 5px}
.sheet{max-width:520px}
.end-wrap{max-width:600px;text-align:center}

/* ========================= TYPE ========================= */
.mono-kicker{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;color:var(--pink);
  text-transform:uppercase}
.mono-kicker.sm{font-size:.6rem;color:var(--ink-soft)}
.desk-title{font-family:var(--f-hand);font-weight:600;color:var(--ink);
  font-size:clamp(2.1rem,7.6vw,3.4rem);line-height:1.08;letter-spacing:-.005em;
  margin:16px 0 2px;transform:rotate(-1.1deg);transform-origin:left center}
.scribble{display:block;width:min(290px,70%);height:auto;overflow:visible;margin:0 0 16px 4px}
.scribble path{fill:none;stroke:var(--pink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:340;stroke-dashoffset:340;transition:stroke-dashoffset 1.1s ease .3s}
.scribble.drawn path{stroke-dashoffset:0}
.hand{font-family:var(--f-hand);font-weight:400;line-height:1.55}
.hand.lead{color:rgba(21,33,44,.62);font-size:1rem;max-width:34ch}
.hand.big{font-size:1.22rem;color:var(--ink)}
.tip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;color:var(--ink-soft)}
.tip.pale{color:rgba(247,241,228,.5)}

.btn{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--f-mono);
  font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;border-radius:2px;
  box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.24)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,0)}
.btn.pinky{background:var(--pink)}
.link{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;color:var(--ink-soft);
  border-bottom:1px solid currentColor;padding-bottom:2px}
.link:hover{color:var(--pink)}
.view#v-end .link,.view#v-open .link{color:rgba(247,241,228,.55)}

/* ========================= 1. PARCEL ========================= */
.parcel{position:relative;aspect-ratio:1.5;perspective:1100px;background:var(--kraft);border-radius:3px;
  box-shadow:var(--hard);transform:rotate(-1.2deg);cursor:pointer;
  transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.parcel:hover{transform:rotate(-1.2deg) translateY(-3px)}
.parcel-back{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:10px;padding:20px}
.post-hand{font-family:var(--f-hand);font-size:clamp(1.5rem,6vw,2.3rem);color:var(--ink)}
.post-mono{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--ink-soft)}
.parcel-flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--paper);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;
  transition:transform .85s cubic-bezier(.5,0,.2,1);backface-visibility:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.06)}
.parcel.open .parcel-flap{transform:rotateX(-172deg)}
.stamp-block{position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:8px}
.stamp{width:44px;height:52px;background:var(--pink);color:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  -webkit-mask:radial-gradient(circle at 3px 3px,transparent 2.6px,#000 2.7px) -3px -3px/8px 8px;
  mask:radial-gradient(circle at 3px 3px,transparent 2.6px,#000 2.7px) -3px -3px/8px 8px}
.stamp b{font-family:var(--f-display);font-size:1.35rem;line-height:1}
.stamp i{font-family:var(--f-mono);font-style:normal;font-size:.42rem;letter-spacing:.1em}
.postmark{position:relative;width:52px;height:52px;opacity:.5}
.postmark svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:1.6}
.postmark em{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);
  font-style:normal;font-size:.46rem;letter-spacing:.06em;text-align:center;line-height:1.25;padding:0 6px}
.parcel-seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
  width:70px;height:70px;border-radius:50%;background:var(--pink);color:var(--paper);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;box-shadow:var(--hard-sm);transition:transform .5s ease,opacity .4s ease;z-index:3}
.parcel.open .parcel-seal{transform:translate(-50%,-50%) scale(.2) rotate(140deg);opacity:0}
.open-wrap .tip{margin-top:22px}

/* ========================= 2. DESK ========================= */
.ticks{display:flex;gap:6px;margin:22px 0 26px;flex-wrap:wrap}
.ticks i{width:26px;height:32px;border:1.5px dashed rgba(21,33,44,.34);border-radius:2px;
  display:block;transition:.35s;position:relative}
.ticks i.on{background:var(--pink);border-style:solid;border-color:var(--pink)}
.ticks i.on::after{content:"";position:absolute;left:7px;top:11px;width:11px;height:6px;
  border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(-45deg)}

.things{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.thing{position:relative;background:var(--paper);border-radius:2px;padding:20px 14px 14px;
  box-shadow:var(--hard);transform:rotate(var(--rot)) translateY(0);text-align:left;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s;
  animation:drop .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d)}
@keyframes drop{from{opacity:0;transform:rotate(var(--rot)) translateY(-16px) scale(.96)}
  to{opacity:1;transform:rotate(var(--rot)) translateY(0) scale(1)}}
.thing:hover{transform:rotate(var(--rot)) translateY(-5px);box-shadow:9px 9px 0 rgba(0,0,0,.30)}
.thing:active{transform:rotate(var(--rot)) translate(3px,3px);box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.thing .tape{position:absolute;top:-9px;left:50%;width:62px;height:19px;transform:translateX(-50%) rotate(-2deg);
  background:rgba(240,180,41,.42);border-left:1px dashed rgba(0,0,0,.10);border-right:1px dashed rgba(0,0,0,.10)}
.thing .art{display:block;height:74px;margin:4px 0 12px}
.thing .art svg{width:100%;height:100%}
.thing .no,.thing .nm,.thing .sub{display:block}
.thing .no{font-family:var(--f-mono);font-size:.6rem;color:var(--pink);letter-spacing:.08em}
.thing .nm{font-family:var(--f-display);font-weight:700;font-size:.98rem;letter-spacing:-.01em;
  line-height:1.15;margin:3px 0 5px}
.thing .sub{font-family:var(--f-hand);font-size:.78rem;color:var(--ink-soft);line-height:1.35}
.thing.done .art{opacity:.35}
.thing .done-mark{position:absolute;right:8px;top:8px;width:44px;height:44px;opacity:0;
  transform:rotate(-14deg) scale(.6);transition:.3s}
.thing.done .done-mark{opacity:1;transform:rotate(-14deg) scale(1)}
.thing.locked{filter:saturate(.35);cursor:default}
.thing.locked .art{opacity:.3}
.thing.locked:hover{transform:rotate(var(--rot));box-shadow:var(--hard)}
.thing .lockmsg{font-family:var(--f-mono);font-size:.55rem;color:var(--ink-soft);letter-spacing:.04em;
  display:none;margin-top:6px}
.thing.locked .lockmsg{display:block}

/* ========================= 3. SHEET ========================= */
.sheet{background:var(--paper);border-radius:3px;box-shadow:var(--hard);padding:18px clamp(16px,4vw,28px) 26px;
  animation:sheetIn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding-bottom:14px;border-bottom:1.5px dashed rgba(21,33,44,.22);margin-bottom:20px}
.stage{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.say{margin-top:22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;
  animation:sheetIn .45s cubic-bezier(.2,.9,.3,1) both}
.say[hidden]{display:none}
.say .rule{display:block;width:52px;height:3px;background:var(--pink)}
.stage .tip{text-align:center}
.stage .btn{align-self:center}

/* photo blocks */
.pic{position:relative;overflow:hidden;background:var(--kraft)}
.pic img{width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;background:var(--kraft);display:grid;place-items:center}
.ph span{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-soft);letter-spacing:.08em}
.ph::before,.ph::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid rgba(21,33,44,.28)}
.ph::before{left:8px;top:8px;border-right:0;border-bottom:0}
.ph::after{right:8px;bottom:8px;border-left:0;border-top:0}

/* --- 01 scratch --- */
.scratch{position:relative;aspect-ratio:4/3;border-radius:2px;overflow:hidden;background:var(--kraft)}
.scratch .pic{position:absolute;inset:0}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;
  transition:opacity .7s ease}
.scratch canvas.gone{opacity:0;pointer-events:none}

/* --- 02 polaroid --- */
.pola{background:#FBF8F1;padding:12px 12px 46px;box-shadow:var(--hard-sm);align-self:center;
  width:min(300px,100%);transform:rotate(1.5deg)}
.pola .win{position:relative;aspect-ratio:1;overflow:hidden;background:#20232A}
.pola .win img{width:100%;height:100%;object-fit:cover;filter:contrast(.35) brightness(1.5) sepia(.5);
  transition:filter 2.4s ease}
.pola .milk{position:absolute;inset:0;background:#EFE9DC;transition:opacity 2.4s ease}
.pola.dev .milk{opacity:0}
.pola.dev .win img{filter:none}
.pola .cap{font-family:var(--f-hand);font-size:.95rem;text-align:center;margin-top:14px;color:var(--ink)}
.pola.shake{animation:shk .55s ease}
@keyframes shk{0%,100%{transform:rotate(1.5deg)}20%{transform:rotate(-4deg) translateX(-6px)}
  50%{transform:rotate(5deg) translateX(7px)}75%{transform:rotate(-3deg)}}

/* --- 03 photograph, turned over --- */
.photowrap{perspective:1500px;align-self:center;width:min(320px,100%)}
.flipcard{position:relative;aspect-ratio:4/5;transform-style:preserve-3d;cursor:pointer;
  transform:rotate(-1.6deg);transition:transform .9s cubic-bezier(.4,0,.2,1)}
.flipcard.flip{transform:rotate(-1.6deg) rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:#FBF8F1;
  box-shadow:var(--hard-sm)}
.fc-front{padding:11px 11px 46px}
.fc-front .pic{width:100%;height:100%}
.fc-back{transform:rotateY(180deg);display:flex;flex-direction:column;gap:14px;padding:26px 22px 18px}
.fc-back .when{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.14em;color:var(--pink)}
.fc-back .hand{font-size:1.05rem;transform:rotate(-.8deg)}
.fc-back .edge{margin-top:auto;font-family:var(--f-mono);font-size:.5rem;letter-spacing:.16em;
  color:var(--ink-soft);border-top:1px dashed rgba(21,33,44,.22);padding-top:9px}
.fc-back .clip{position:absolute;right:18px;top:-12px;width:22px;height:52px;border:3px solid var(--ink-soft);
  border-radius:11px;opacity:.55}

/* --- 04 film negative --- */
.negwrap{width:100%}
.neg{position:relative;aspect-ratio:16/10;background:#1C140E;overflow:hidden;touch-action:none;
  cursor:crosshair;box-shadow:var(--hard-sm)}
.neg-layer{position:absolute;left:0;right:0;top:15%;bottom:15%}
.neg-layer .pic{position:absolute;inset:0;background:#3B2A1C}
.neg-layer.inv .pic{filter:invert(1) sepia(.62) hue-rotate(158deg) saturate(1.4) contrast(.9)}
.neg-layer.pos{clip-path:circle(0px at 50% 50%);transition:clip-path .1s linear}
.perf{position:absolute;left:0;right:0;height:15%;background:#1C140E;z-index:2}
.perf::after{content:"";position:absolute;left:0;right:0;top:50%;height:54%;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,rgba(247,241,228,.9) 0 13px,transparent 13px 27px)}
.perf.t{top:0}
.perf.b{bottom:0}
.neg .edgeprint{position:absolute;right:8px;bottom:2.5%;z-index:3;font-family:var(--f-mono);
  font-size:.48rem;letter-spacing:.18em;color:rgba(240,180,41,.85)}

/* --- 05 sticker --- */
.peel{position:relative;aspect-ratio:4/3;background:var(--kraft);overflow:hidden}
.peel .under{position:absolute;inset:0}
.peel .under .pic{position:absolute;inset:0}
.peel .under .msg{position:absolute;left:0;right:0;bottom:0;padding:14px;background:rgba(247,241,228,.94);
  font-family:var(--f-hand);font-size:.95rem}
.stick{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;margin:-31% 0 0 -31%;
  border-radius:50%;background:var(--marigold);display:grid;place-items:center;text-align:center;
  transform-origin:100% 100%;box-shadow:var(--hard-sm);cursor:pointer;touch-action:none;
  border:5px solid var(--paper)}
.stick b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.05;color:var(--ink);
  padding:0 12px}
.stick.off{transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .5s;
  transform:rotate(-96deg) translate(-30%,20%);opacity:0}
.holdbar{height:3px;background:rgba(21,33,44,.14);overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:var(--pink)}

/* --- 06 seven inch single --- */
.vinylwrap{position:relative;align-self:center;width:min(280px,84%);aspect-ratio:1;cursor:pointer}
.discholder{position:absolute;inset:3%;z-index:1;
  transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.vinylwrap.out .discholder{transform:translateX(38%)}
.disc{width:100%;height:100%;border-radius:50%;background:#100E0D;display:grid;place-items:center;
  background-image:repeating-radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.05) 0 1px,transparent 1px 4px);
  box-shadow:var(--hard-sm)}
.vinylwrap.spin .disc{animation:spin 1.9s linear infinite}
.label{position:relative;width:38%;height:38%;border-radius:50%;background:var(--marigold);
  display:grid;place-items:center}
.label::after{content:"";width:9%;height:9%;min-width:5px;min-height:5px;border-radius:50%;
  background:var(--paper);position:absolute}
.label b{font-family:var(--f-mono);font-size:.5rem;letter-spacing:.1em;
  transform:translateY(-118%);color:var(--ink)}
.sleeve{position:absolute;inset:0;z-index:3;background:var(--paper);box-shadow:var(--hard-sm);
  padding:11px;transition:transform .5s ease}
.sleeve .pic{width:100%;height:100%}
.sleeve .notch{position:absolute;right:0;top:14%;bottom:14%;width:14px;background:var(--kraft);
  border-left:1.5px dashed rgba(21,33,44,.25)}
.vinylwrap.out .sleeve{transform:translateX(-5%) rotate(-1.5deg)}
.songcard{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;
  opacity:0;transform:translateY(8px);transition:.6s}
.songcard.in{opacity:1;transform:none}
.songcard .ttl{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,7vw,2.7rem);
  line-height:1;letter-spacing:-.03em}
.songcard .by{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.22em;color:var(--ink-soft)}
.songcard .why{font-family:var(--f-hand);font-size:.98rem;max-width:30ch;margin-top:4px}
.player{width:100%;background:var(--paper);box-shadow:var(--hard-sm);padding:9px;

let bits = [], running = false;
function sizeFx(){ if(!fxc) return; fx.width = innerWidth; fx.height = innerHeight; }
sizeFx(); addEventListener("resize", sizeFx);

function punch(n){
  if (!fxc) return;
  const cols = ["#FF5470","#F0B429","#F7F1E4","#2E8B78"];
  for (let i=0;i<n;i++){
    bits.push({
      x: Math.random()*innerWidth, y: -20 - Math.random()*innerHeight*0.5,
      vx: (Math.random()-0.5)*1.5, vy: 1.6 + Math.random()*2.6,
      w: 6 + Math.random()*9, h: 4 + Math.random()*8,
      r: Math.random()*6.28, vr: (Math.random()-0.5)*0.12,
      round: Math.random() < 0.3,
      c: cols[(Math.random()*cols.length)|0], life: 1
    });

  if (!running){ running = true; requestAnimationFrame(step); }
}
function step(){
  fxc.clearRect(0,0,fx.width,fx.height);
  for (let i=bits.length-1;i>=0;i--){
    const b = bits[i];
    b.x += b.vx; b.y += b.vy; b.r += b.vr;
    if (b.y > innerHeight + 40){ bits.splice(i,1); continue; }
    fxc.save(); fxc.translate(b.x,b.y); fxc.rotate(b.r); fxc.fillStyle = b.c;

    else fxc.fillRect(-b.w/2,-b.h/2,b.w,b.h);
    fxc.restore();
  }
  if (bits.length) requestAnimationFrame(step);
  else { running = false; fxc.clearRect(0,0,fx.width,fx.height); }
}

  let ctx=null, drawing=false, moves=0, over=false, alive=true;

  function cover(){
    if (typeof cv.getContext !== "function"){ cv.style.display="none"; api.done(); return; }
    const w = Math.max(1, Math.round(box.clientWidth)), h = Math.max(1, Math.round(box.clientHeight));
    cv.width = w; cv.height = h;
    ctx = cv.getContext("2d");
    if (!ctx){ cv.style.display="none"; api.done(); return; }
    ctx.fillStyle = "#F0B429"; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = "rgba(21,33,44,.16)"; ctx.lineWidth = 3;
    for (let x=-h; x<w; x+=13){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+h,h); ctx.stroke(); }
    ctx.fillStyle = "rgba(21,33,44,.62)";
    ctx.font = "500 " + Math.max(10, Math.round(w/26)) + "px 'DM Mono',monospace";
    ctx.textAlign = "center";
    ctx.fillText("SCRATCH HERE", w/2, h/2 + 4);
    ctx.globalCompositeOperation = "destination-out";
  }
  function cleared(){
    if (!ctx) return 100;
    const d = ctx.getImageData(0,0,cv.width,cv.height).data;
    let c=0,t=0;
    for (let i=3;i<d.length;i+=96){ t++; if (d[i]<40) c++; }
    return t ? Math.round(c/t*100) : 0;
  }
  function at(e){
    const r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) };
  }
  function rub(e){
    if (!ctx || over) return;
    const p = at(e);
    ctx.beginPath(); ctx.arc(p.x,p.y, Math.max(20, cv.width*0.085), 0, 6.2832); ctx.fill();
    if (++moves % 7 === 0 && cleared() >= 52) finish();
  }
  function finish(){
    if (over) return;
    over = true;
    cv.classList.add("gone");
    tip.remove();
    setTimeout(()=>{ if (alive) api.done(); }, 650);
  }
  cv.addEventListener("pointerdown",e=>{ drawing=true; try{cv.setPointerCapture(e.pointerId);}catch(x){} rub(e); });
  cv.addEventListener("pointermove",e=>{ if(drawing) rub(e); });
  cv.addEventListener("pointerup",  ()=>{ drawing=false; if(!over && cleared()>=52) finish(); });
  cv.addEventListener("pointerleave",()=>{ drawing=false; });

  if (api.already){ cv.style.display = "none"; tip.remove(); api.done(); }
  else requestAnimationFrame(()=>{ if (alive) cover(); });

  return function(){ alive=false; drawing=false; };
}

/* ==========================================================
   04 · FILM NEGATIVE
   ========================================================== */
function buildNegative(api){
  const wrap = el("div","negwrap");
  const strip = el("div","neg");

  const inv = el("div","neg-layer inv"); inv.appendChild(pic(api.n));
  const pos = el("div","neg-layer pos"); pos.appendChild(pic(api.n));
  strip.appendChild(inv);
  strip.appendChild(pos);
  strip.appendChild(el("div","perf t"));
  strip.appendChild(el("div","perf b"));
  strip.appendChild(el("span","edgeprint","8 \u2192 8A"));
  wrap.appendChild(strip);

  const tip = tipLine("move the light across it");
  const btn = el("button","btn","hold it up to the light");
  btn.type = "button";
  api.stage.appendChild(wrap);
  api.stage.appendChild(tip);
  api.stage.appendChild(btn);

  let travelled = 0, lx = null, ly = null, over = false, t = 0;

  function lens(e){
    if (over) return;
    const r = pos.getBoundingClientRect();
    if (!r.width) return;
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const rad = Math.max(58, r.width * 0.17);
    const val = "circle(" + rad.toFixed(0) + "px at " + x.toFixed(0) + "px " + y.toFixed(0) + "px)";
    pos.style.clipPath = val;
    pos.style.webkitClipPath = val;
    if (lx !== null){
      const d = Math.sqrt((x-lx)*(x-lx) + (y-ly)*(y-ly));
      if (d < 220) travelled += d;   // ignore the jump when the pointer re-enters
    }
    lx = x; ly = y;
    if (travelled > 900) reveal();
  }
  function reveal(){
    if (over) return;
    over = true;
    pos.style.transition = "clip-path .85s cubic-bezier(.3,.8,.3,1)";
    const val = "circle(150% at 50% 50%)";
    pos.style.clipPath = val;
    pos.style.webkitClipPath = val;
    tip.remove(); btn.remove();
    t = setTimeout(()=>api.done(), 900);
  }

  strip.addEventListener("pointermove", lens);
  strip.addEventListener("pointerdown", e=>{
    try{ strip.setPointerCapture(e.pointerId); }catch(x){}
    lx = null; lens(e);
  });
  strip.addEventListener("pointerleave", ()=>{ lx = null; });
  btn.addEventListener("click", reveal);

  if (api.already){
    over = true;
    const val = "circle(150% at 50% 50%)";
    pos.style.clipPath = val; pos.style.webkitClipPath = val;
    tip.remove(); btn.remove();
    api.done();
  }
  return function(){ clearTimeout(t); };
}

/* ==========================================================
   05 · STICKER
   ========================================================== */
function buildSticker(api){
  const peel = el("div","peel");
  const under = el("div","under");
  under.appendChild(pic(api.n));
  under.appendChild(el("div","msg", api.data.msg || ""));
  const stick = el("div","stick","<b>peel<br>me</b>");
  peel.appendChild(under); peel.appendChild(stick);
  const bar = el("div","holdbar","<i></i>");
  const fill = bar.querySelector("i");
  const tip = tipLine("press and hold");
  api.stage.appendChild(peel);
  api.stage.appendChild(bar);
  api.stage.appendChild(tip);

  let held=false, p=0, raf=0, over=false, alive=true, t=0;
  function frame(){
    if (!alive || over) return;
    p = held ? Math.min(1, p + 0.018) : Math.max(0, p - 0.035);
    stick.style.transform = "rotate(" + (-72*p) + "deg)";
    fill.style.width = (p*100) + "%";
    if (p >= 1){ finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  function finish(){
    if (over) return;
    over = true;
    stick.style.transform = "";
    stick.classList.add("off");
    bar.remove(); tip.remove();
    t = setTimeout(()=>{ if (alive) api.done(); }, 640);
  }
  stick.addEventListener("pointerdown", e=>{
    held = true;
    try{ stick.setPointerCapture(e.pointerId); }catch(x){}
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  });
  stick.addEventListener("pointerup",   ()=>{ held = false; });
  stick.addEventListener("pointercancel",()=>{ held = false; });
  stick.addEventListener("pointerleave",()=>{ held = false; });

  if (api.already){ over = true; stick.classList.add("off"); bar.remove(); tip.remove(); api.done(); }
  return function(){ alive=false; held=false; cancelAnimationFrame(raf); clearTimeout(t); };
}

/* ==========================================================
   06 · SEVEN INCH SINGLE  ·  and it actually plays
   ========================================================== */
function buildSingle(api){
  const song = CONFIG.song || {};

  const wrap = el("div","vinylwrap");
  const holder = el("div","discholder");
  const disc = el("div","disc");
  disc.appendChild(el("div","label","<b>45 RPM</b>"));
  holder.appendChild(disc);
  const sleeve = el("div","sleeve");
  sleeve.appendChild(pic(api.n));
  sleeve.appendChild(el("span","notch"));
  wrap.appendChild(holder);
  wrap.appendChild(sleeve);

  const tip = tipLine("tap to play it");

  const card = el("div","songcard");
  card.appendChild(el("p","ttl", song.title || ""));
  card.appendChild(el("p","by", (song.artist || "").toUpperCase()));

  const player = el("div","player");
  player.innerHTML =
    '<div class="plabel"><b>NOW PLAYING</b><span>SIDE A</span></div>' +
    '<div class="frame">' +
      '<div class="fallback">' +
        '<span class="disc-mini"><span class="tri"></span></span>' +
        '<b>' + (song.title || "") + '</b>' +
        '<i>' + (song.artist || "").toUpperCase() + '</i>' +
      '</div>' +
    '</div>';

  const tail = el("div","songcard");
  if (song.why) tail.appendChild(el("p","why", song.why));
  if (song.url){
    const a = el("a","playlink","open it in your music app");
    a.href = song.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    tail.appendChild(a);
  }

  api.stage.appendChild(wrap);
  api.stage.appendChild(tip);
  api.stage.appendChild(card);
  if (song.youtubeId) api.stage.appendChild(player);
  api.stage.appendChild(tail);

  const timers = [];
  let used = false;

  // The iframe has to be created inside the click handler itself. Browsers only
  // allow sound to start off the back of a real tap, so building it on a timer
  // would get the audio blocked.
  function mountPlayer(autoplay){
    if (!song.youtubeId) return;
    const frame = player.querySelector(".frame");
    if (!frame || frame.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + song.youtubeId +
            "?autoplay=" + (autoplay ? "1" : "0") +
            "&playsinline=1&rel=0&modestbranding=1";
    f.setAttribute("allow","autoplay; encrypted-media; picture-in-picture");
    f.setAttribute("allowfullscreen","");
    f.title = (song.title || "song") + " by " + (song.artist || "");
    frame.appendChild(f);
  }

  function play(instant){
    if (used) return;
    used = true;
    tip.remove();
    mountPlayer(!instant);
    wrap.classList.add("out");
    if (instant){
      card.classList.add("in"); tail.classList.add("in"); player.classList.add("in");
      api.done();
      return;
    }
    timers.push(setTimeout(()=>wrap.classList.add("spin"), 420));
    timers.push(setTimeout(()=>{ card.classList.add("in"); player.classList.add("in"); }, 1150));
    timers.push(setTimeout(()=>tail.classList.add("in"), 1500));
    // a few turns, then it settles so the label sits still
    timers.push(setTimeout(()=>wrap.classList.remove("spin"), 4600));
    timers.push(setTimeout(()=>api.done(), 1900));
  }
  wrap.addEventListener("click", ()=>play(false));

  if (api.already) play(true);

  // pulling the iframe out is what stops the music when she puts the record back
  return function(){
    timers.forEach(clearTimeout);
    const f = player.querySelector("iframe");
    if (f) f.remove();
  };
}

    timers.push(setTimeout(()=>{ punch(70); api.done(); }, 700 + ps.length*420));
  }
  seal.addEventListener("click", ()=>open(false));

  if (api.already) open(true);
  return function(){ timers.forEach(clearTimeout); };
}
